spring:
  application:
    name: rag-engine-sample
  flyway:
    locations: classpath:db/migration,classpath:db/rag
  jpa:
    hibernate:
      ddl-auto: validate

rag-engine:
  web:
    enabled: true
    require-authentication: false
  sources:
    - name: docs
      type: filesystem
      path: ./docs-sample
      include:
        - "**/*.txt"
        - "**/*.md"
